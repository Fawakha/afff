<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Мій Інвентар</title>
    <style>
       
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1b2838; color: white; padding: 40px; }
        h1 { text-align: center; color: #c7d5e0; letter-spacing: 2px; }
        #inventory-container { display: flex; gap: 20px; justify-content: center; margin-top: 40px; flex-wrap: wrap; }
        
    
        .card { 
            background: linear-gradient(145deg, #2a475e, #171a21); 
            border: 1px solid #66c0f4; 
            border-radius: 8px; 
            padding: 20px; 
            width: 220px; 
            text-align: center; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.6); 
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); }
        .item-name { font-size: 1.4em; font-weight: bold; color: #eb4b4b; margin-bottom: 5px; } /* Червоний колір для крутих предметів */
        .item-type { color: #8f98a0; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; }
        .wear { font-size: 0.9em; color: #c7d5e0; margin-top: 15px; }
        .price { color: #a4d007; font-weight: bold; font-size: 1.3em; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>АРСЕНАЛ</h1>
    <button onclick="LoadItems('All')">Всі предмети</button>
    <button onclick="LoadItems('Gun')">Зброя</button>
    <button onclick="LoadItems('knife')">Ножі</button>
    </div>

    <div class = "form-container"> 
        <input type="text" id="item-name" placeholder="Назва предмета">
        <input type="text" id="item-type" placeholder="Тип предмета">
        <input type="number" id="item-wear" step="0.01" placeholder="Стан предмета">
        <input type="number" id="item-price" step="0.01" placeholder="Ціна предмета">
        <button onclick="AddNewItem()">Додати предмет</button>
    </div>
    <div id="inventory-container"></div>

    <script>
        function LoadItems(type) {
            fetch(`http://localhost:5284/inventory/${type}`)
                .then(response => response.json())
                .then(items => {
                    const container = document.getElementById('inventory-container');
                    container.innerHTML = ''; 
                    items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        
                        card.innerHTML = `
                            <h3>${item.name}</h3>
                            <button onclick="DeleteItem(${item.id})">Видалити</button>
                            <div class="item-name">${item.name}</div>
                            <div class="item-type">${item.type}</div>
                            <div class="wear">Wear: ${item.wear}</div>
                            <div class="price">$${item.price}</div>
                        `;
                        
                        container.appendChild(card);
                    });
                })
                .catch(error => {
                    console.error('Помилка підключення до сервера:', error);
                    document.getElementById('inventory-container').innerHTML = '<p style="color:red;">Сервер не відповідає. Перевір, чи запущений .NET!</p>';
                });
        }
function AddNewItem() {
    const name = document.getElementById('item-name').value;
    const type = document.getElementById('item-type').value;
    const wear = document.getElementById('item-wear').value;
    const price = document.getElementById('item-price').value;

    if (name && type && wear && price) {
        fetch('http://localhost:5284/inventory', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                name: name, 
                type: type, 
                wear: parseFloat(wear), 
                price: parseFloat(price) 
            })
        })
        .then(response => response.json())
        .then(data => {
            alert('Предмет додано успішно!');
            

            document.getElementById('item-name').value = '';
            document.getElementById('item-type').value = '';
            document.getElementById('item-wear').value = '';
            document.getElementById('item-price').value = '';

            LoadItems('All'); 
        })
        .catch(error => {
            console.error('Помилка при додаванні предмета:', error);
            alert('Не вдалося додати предмет. Перевірте сервер.');
        });
    } else {
        alert('Будь ласка, заповніть всі поля.');
    }
}
        function DeleteItem(id) { 
            fetch(`http://localhost:5284/inventory/${id}`, { 
                method: 'DELETE'
            })
            .then(response => {
                if (response.ok) {
                    alert('Предмет видалено успішно!');
                    LoadItems('All'); 
                } else {
                    alert('Не вдалося видалити предмет. Перевірте сервер.');
                }
            })
        }
    </script>

</body>
</html>
